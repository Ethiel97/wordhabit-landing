<!doctype html>
<!--
  Source of public/og-image-v3.png (1200x630). Render with
  `node scripts/og-image/render.mjs`; see that file for details.

  Store badges are the official artwork from public/badges/, unmodified:
  App Store first, same visible height, at least a quarter of that height
  of clear space around each (Apple and Google guidelines).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@600&family=JetBrains+Mono:wght@500;700&display=block">
  <style>
    :root {
      --green: #22C55E;
      --green-700: #15803D;
      --green-light: #4ADE80;
      --ink: #0F1B12;
      --badge-height: 60px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0D1B11;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: #fff;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(720px 440px at 0% 0%, rgba(34, 197, 94, 0.13), transparent 70%),
        radial-gradient(640px 340px at 0% 100%, rgba(202, 178, 52, 0.16), transparent 72%),
        radial-gradient(640px 520px at 82% 42%, rgba(34, 197, 94, 0.07), transparent 70%),
        linear-gradient(160deg, #10241A 0%, #0C1A10 55%, #08100A 100%);
    }

    /* The word on the phone's screen, as a texture along the bottom edge. */
    .ghost {
      position: absolute;
      left: -14px;
      top: 556px;
      margin: 0;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 220px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.045);
      white-space: nowrap;
    }

    .logo {
      position: absolute;
      left: 72px;
      top: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: var(--green);
      box-shadow: 0 4px 0 0 var(--green-700), 0 10px 28px rgba(34, 197, 94, 0.35);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 26px;
    }

    .logo-word {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .live {
      position: absolute;
      right: 520px;
      top: 70px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.14em;
      color: #86EFAC;
    }

    .live::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    h1 {
      position: absolute;
      left: 68px;
      top: 128px;
      margin: 0;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    h1 em {
      font-style: normal;
      color: var(--green-light);
    }

    .checks {
      position: absolute;
      left: 72px;
      top: 312px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 15px;
    }

    .checks li {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      font-size: 24px;
      line-height: 30px;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.9);
    }

    .checks svg { flex-shrink: 0; }

    /* Gap of 16px between badges is more than a quarter of 60px (15px). */
    .badges {
      position: absolute;
      left: 72px;
      top: 496px;
      display: flex;
      gap: 16px;
    }

    .badges img {
      display: block;
      height: var(--badge-height);
      width: auto;
    }

    .url {
      position: absolute;
      right: 520px;
      top: 516px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 17px;
      line-height: 20px;
      color: rgba(255, 255, 255, 0.42);
    }

    /* Same geometry as app/components/landing/PhoneShot.vue at width 340. */
    .phone {
      position: absolute;
      left: 788px;
      top: 42px;
      width: 340px;
      padding: 12px;
      border-radius: 52.7px;
      background: var(--ink);
      box-shadow:
        0 0 0 1.5px rgba(255, 255, 255, 0.07),
        0 30px 70px -10px rgba(0, 0, 0, 0.6),
        0 0 120px rgba(34, 197, 94, 0.10);
    }

    .screen {
      overflow: hidden;
      border-radius: 40.7px;
      background: #F8FAF8;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    /* The capture carries the device's own status bar; the crop hides it
       so the drawn one above stays the only clock on screen. */
    .capture { overflow: hidden; }

    .capture img {
      display: block;
      width: 100%;
      height: auto;
      margin-top: -13.9%;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="ghost" aria-hidden="true">Metaphor</p>

    <div class="logo">
      <div class="logo-mark">W</div>
      <span class="logo-word">Wordhabit</span>
    </div>

    <div class="live">LIVE ON BOTH STORES</div>

    <h1>One word a day.<br><em>Kept</em> for life.</h1>

    <ul class="checks">
      <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="rgba(34, 197, 94, 0.18)"/><path d="M8 13.3l3.3 3.3L18.2 9.7" stroke="#4ADE80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Five minutes: discover, practice, quiz</li>
      <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="rgba(34, 197, 94, 0.18)"/><path d="M8 13.3l3.3 3.3L18.2 9.7" stroke="#4ADE80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>English, French and Spanish</li>
      <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="rgba(34, 197, 94, 0.18)"/><path d="M8 13.3l3.3 3.3L18.2 9.7" stroke="#4ADE80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Review returns right before you forget</li>
    </ul>

    <div class="badges">
      <img src="../../public/badges/app-store-en.svg" alt="Download on the App Store">
      <img src="../../public/badges/google-play-en.png" alt="Get it on Google Play">
    </div>

    <div class="url">wordhabit.app</div>

    <div class="phone">
      <div class="screen">
        <div class="status">
          <span>9:41</span>
          <svg width="34" height="11" viewBox="0 0 34 11" fill="#0F1B12" aria-hidden="true">
            <rect x="0" y="6" width="2.4" height="4" rx="0.8"/>
            <rect x="3.8" y="4" width="2.4" height="6" rx="0.8"/>
            <rect x="7.6" y="2" width="2.4" height="8" rx="0.8"/>
            <path d="M14 5.2a5.6 5.6 0 0 1 7 0l-1.2 1.4a3.8 3.8 0 0 0-4.6 0z"/>
            <circle cx="17.5" cy="8.6" r="1.4"/>
            <rect x="24" y="2.5" width="9" height="6" rx="2" fill="none" stroke="#0F1B12" stroke-width="1"/>
            <rect x="25.2" y="3.7" width="5.2" height="3.6" rx="1"/>
          </svg>
        </div>
        <div class="capture">
          <img src="../../public/app-home-v2.webp" alt="">
        </div>
      </div>
    </div>
  </main>
</body>
</html>
